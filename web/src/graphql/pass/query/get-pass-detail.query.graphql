query GetPassDetail($slug: String!) {
  getPassDetail(slug: $slug) {
    registration {
      id
      name
      email
      eventId
      slug
    }
    event {
      id
      title
      headerImage
      category
      startDate
      endDate
      startTime
      endTime
      mode {
        id
        eventMode
        city
        state
      }
      passes {
        id
        pricing
        price
      }
    }
  }
}
