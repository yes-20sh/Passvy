query GetEvent($slug: String!) {
  getEvent(slug: $slug) {
    message
    event {
      id
      title
      slug
      headerImage
      startDate
      startTime
      endDate
      endTime
      category
      status
      stepper
      mode {
        eventMode
        onlineLink
        meetingStartDate
        meetingStartTime
        meetingEndDate
        meetingEndTime
        offlineAddress
        offlineMapLink
        offlineLandmark
        city
        state
        country
        capacity
      }
      descriptionBlocks {
        id
        blockType
        content
        headingLevel
        textSize
        listStyle
        sortOrder
      }
      passes {
        id
        pricing
        tier
        customName
        passCategory
        quantity
        price
      }
      coupons {
        id
        code
        discountType
        discountValue
        usageLimit
      }
      paymentSetting {
        id
        acceptedMethods
      }
      createdAt
      updatedAt
    }
  }
}
