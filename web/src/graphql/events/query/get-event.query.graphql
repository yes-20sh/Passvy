query GetEvent($eventId: String!) {
  getEvent(eventId: $eventId) {
    message
    statusCode
    event {
      id
      title
      slug
      headerImage
      startDate
      startTime
      endDate
      endTime
      category
      status
      stepper
      mode {
        id
        eventMode
        onlineLink
        offlineAddress
        offlineMapLink
        offlineLandmark
        capacity
      }
      descriptionBlocks {
        id
        blockType
        content
        headingLevel
        textSize
        listStyle
        sortOrder
      }
      passes {
        id
        pricing
        tier
        customName
        passCategory
        quantity
        price
      }
      coupons {
        id
        code
        discountType
        discountValue
        usageLimit
      }
      paymentSetting {
        id
        acceptedMethods
      }
      createdAt
      updatedAt
    }
  }
}
