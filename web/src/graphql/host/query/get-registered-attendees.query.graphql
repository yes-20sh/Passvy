query GetRegisteredAttendees($input: GetRegisteredAttendeesInput!) {
  getRegisteredAttendees(input: $input) {
    data {
      id
      name
      email
      mobileNumber
      passType
      ticketId
      registerDate
      status
    }
    meta {
      totalItems
      itemCount
      itemsPerPage
      totalPages
      currentPage
      hasNextPage
      hasPreviousPage
    }
  }
}
